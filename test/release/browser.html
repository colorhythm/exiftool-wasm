<!doctype html>
<html lang="en-US">
    <meta charset="utf-8">
    <title>ExifTool packed release verification</title>
    <body>
        <p>ExifTool packed release verification</p>
        <script type="module">
            import { runBrowserSmoke } from './browser-entry.mjs';
            window.runExiftoolRelease = runBrowserSmoke;
            window.runExiftoolWorkerRelease = (options) => new Promise((resolve, reject) => {
                const worker = new Worker('./worker.mjs', { type: 'module' });
                const timer = setTimeout(() => {
                    worker.terminate();
                    reject(new Error('Module-worker verification timed out.'));
                }, 90000);
                worker.onmessage = ({ data }) => {
                    clearTimeout(timer);
                    worker.terminate();
                    resolve(data);
                };
                worker.onerror = (event) => {
                    clearTimeout(timer);
                    worker.terminate();
                    reject(new Error(event.message));
                };
                worker.postMessage(options);
            });
        </script>
    </body>
</html>
