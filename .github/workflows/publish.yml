name: Check npm publication credential

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    identity:
        runs-on: ubuntu-24.04
        steps:
            -   uses: actions/setup-node@v4
                with:
                    node-version: '24.x'
                    registry-url: 'https://registry.npmjs.org'
            -   name: Verify the existing publication credential without publishing
                env:
                    NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                run: npm whoami
